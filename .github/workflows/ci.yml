name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SIFCA_TEST_PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Documentación y especificaciones
        run: node scripts/docs.mjs check --strict
      - name: Generar cliente de Prisma y compilar contratos
        run: pnpm --filter @sifca/api prisma:generate && pnpm --filter @sifca/contracts build
      - name: Tipos
        run: pnpm --filter @sifca/api typecheck
      - name: Pruebas unitarias
        run: pnpm --filter @sifca/api test:unit
      - name: Arquitectura (D-1…D-7, ciclos)
        run: pnpm --filter @sifca/api test:arch
      - name: Integración (PostgreSQL real: triggers, privilegios, RLS, concurrencia)
        run: pnpm --filter @sifca/api test:integration
      - name: Contrato HTTP
        run: pnpm --filter @sifca/api test:contract
      - name: Aceptación (Gherkin de la spec)
        run: pnpm --filter @sifca/api test:acceptance
