name: docs-check

# Constitución VIII: el CI verifica enlaces, reglas, escenarios Gherkin, specs, espejo de la constitución y
# la matriz de trazabilidad.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificar documentación y especificaciones (parser oficial de Gherkin)
        run: node scripts/docs.mjs check --strict
