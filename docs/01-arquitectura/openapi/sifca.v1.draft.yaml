openapi: 3.1.0
info:
  title: SIFCA API
  version: 0.1.0-draft
  summary: Contrato de diseño (borrador de Fase 1) de la API pública de SIFCA.
  description: |
    **Documento de diseño, no generado.** Cuando exista código, la fuente de verdad pasa a ser el OpenAPI
    generado por NestJS (`@nestjs/swagger`), que se compara contra este borrador en CI.

    Convenciones (detalle en `docs/01-arquitectura/04-contrato-api-y-swagger.md`):
    - JSON en `camelCase`; identificadores UUID v7; fechas ISO 8601.
    - **Importes monetarios, cantidades y porcentajes viajan como cadenas decimales** (`"1190000.00"`),
      nunca como números de punto flotante.
    - Errores en `application/problem+json` (RFC 9457) con un `code` estable.
    - Paginación por cursor. `Idempotency-Key` en los `POST` que crean dinero, stock o documentos fiscales.
  license:
    name: Propietaria
    identifier: LicenseRef-Proprietary
servers:
  - url: "{baseUrl}/api/v1"
    variables:
      baseUrl:
        default: http://localhost:3000
        description: Origen del servidor (cambia por entorno).
tags:
  - name: Catalog
    description: Ítems, categorías y listas de precios.
  - name: Parties
    description: Terceros (clientes, proveedores).
  - name: Inventory
    description: Existencias, kardex y movimientos.
  - name: Sales
    description: Cotizaciones, pedidos, facturas y notas.
  - name: Receivables
    description: Cartera, recibos de caja y estados de cuenta.
  - name: Accounting
    description: Comprobantes, libros y balances.
  - name: Reports
    description: Reportes de solo lectura.
  - name: Storefront
    description: API pública de la vitrina (sin autenticación).
  - name: Integrations
    description: Webhooks, alimentador de catálogo y datos de render para motores externos.
security:
  - bearerAuth: []
  - apiKeyAuth: []
paths:
  /parties:
    get:
      tags: [Parties]
      operationId: parties_list
      summary: Lista terceros
      x-required-scopes: ["parties:read"]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/PartyKind" }
        - name: q
          in: query
          description: Búsqueda por nombre o identificación (insensible a tildes).
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Página de terceros.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Party" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [Parties]
      operationId: parties_create
      summary: Crea un tercero
      x-required-scopes: ["parties:write"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartyInput" }
      responses:
        "201":
          description: Tercero creado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Party" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /parties/{partyId}:
    get:
      tags: [Parties]
      operationId: parties_get
      summary: Obtiene un tercero
      x-required-scopes: ["parties:read"]
      parameters:
        - $ref: "#/components/parameters/PartyId"
      responses:
        "200":
          description: Tercero.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Party" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /items:
    get:
      tags: [Catalog]
      operationId: items_list
      summary: Lista ítems
      x-required-scopes: ["catalog:read"]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, INACTIVE] }
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Página de ítems.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Item" }
        default: { $ref: "#/components/responses/Problem" }

  /inventory/stock:
    get:
      tags: [Inventory]
      operationId: inventory_stock_list
      summary: Existencias y disponible por ítem y bodega
      description: El **disponible** es `onHand − reserved`. Las integraciones deben usar `available`.
      x-required-scopes: ["inventory:read"]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: itemId
          in: query
          schema: { type: string, format: uuid }
        - name: warehouseId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Saldos.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/StockBalance" }
        default: { $ref: "#/components/responses/Problem" }

  /sales/invoices:
    get:
      tags: [Sales]
      operationId: sales_invoices_list
      summary: Lista facturas de venta
      x-required-scopes: ["invoices:read"]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/DocumentStatus" }
        - name: customerId
          in: query
          schema: { type: string, format: uuid }
        - name: issuedFrom
          in: query
          schema: { type: string, format: date }
        - name: issuedTo
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Página de facturas.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Invoice" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [Sales]
      operationId: sales_invoices_create_draft
      summary: Crea una factura en borrador
      description: Calcula impuestos y retenciones con vista previa; no consume numeración ni afecta inventario.
      x-required-scopes: ["invoices:write"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceDraftInput" }
      responses:
        "201":
          description: Borrador creado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "422": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /sales/invoices/{invoiceId}:
    get:
      tags: [Sales]
      operationId: sales_invoices_get
      summary: Obtiene una factura
      x-required-scopes: ["invoices:read"]
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      responses:
        "200":
          description: Factura.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /sales/invoices/{invoiceId}/issue:
    post:
      tags: [Sales]
      operationId: sales_invoices_issue
      summary: Emite la factura
      description: |
        En **una sola transacción**: asigna el consecutivo, descuenta inventario, genera el comprobante
        contable y registra el evento de salida (outbox). Luego la transmisión a la DIAN es asíncrona; el
        estado evoluciona `ISSUED → TRANSMITTING → ACCEPTED | REJECTED`.
        Responde `202` porque la validación de la DIAN aún no termina.
      x-required-scopes: ["invoices:issue"]
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Factura emitida y en transmisión.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "409":
          description: Estado inválido, rango de numeración agotado o stock insuficiente.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /sales/invoices/{invoiceId}/pdf:
    get:
      tags: [Sales]
      operationId: sales_invoices_pdf
      summary: Descarga el PDF (representación gráfica)
      description: Solo disponible cuando la factura fue aceptada; devuelve la copia guardada, no la regenera.
      x-required-scopes: ["invoices:read"]
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      responses:
        "200":
          description: PDF.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "409":
          description: Aún no hay PDF (la factura no ha sido aceptada).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /sales/invoices/{invoiceId}/credit-notes:
    post:
      tags: [Sales]
      operationId: sales_credit_notes_create
      summary: Crea una nota crédito sobre la factura
      x-required-scopes: ["invoices:write", "invoices:issue"]
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreditNoteInput" }
      responses:
        "202":
          description: Nota crédito emitida y en transmisión.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        default: { $ref: "#/components/responses/Problem" }

  /receivables/receipts:
    post:
      tags: [Receivables]
      operationId: receivables_receipts_create
      summary: Registra un recibo de caja y lo aplica a facturas
      x-required-scopes: ["receipts:write"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReceiptInput" }
      responses:
        "201":
          description: Recibo registrado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
        default: { $ref: "#/components/responses/Problem" }

  /receivables/customers/{partyId}/statement:
    get:
      tags: [Receivables]
      operationId: receivables_statement_get
      summary: Estado de cuenta de un cliente a una fecha de corte
      x-required-scopes: ["receivables:read"]
      parameters:
        - $ref: "#/components/parameters/PartyId"
        - name: asOf
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: Estado de cuenta.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountStatement" }
        default: { $ref: "#/components/responses/Problem" }

  /reports/trial-balance:
    get:
      tags: [Reports]
      operationId: reports_trial_balance
      summary: Balance de prueba
      x-required-scopes: ["reports:read"]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: level
          in: query
          description: Nivel de cuenta (1 clase, 2 grupo, 4 cuenta, 6 subcuenta, 8 auxiliar).
          schema: { type: integer, enum: [1, 2, 4, 6, 8], default: 4 }
      responses:
        "200":
          description: Balance de prueba.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrialBalance" }
        default: { $ref: "#/components/responses/Problem" }

  /public/catalog:
    get:
      tags: [Storefront]
      operationId: public_catalog_list
      summary: Catálogo público de la vitrina
      description: Solo ítems publicados. Nunca expone costos ni datos internos. Con límite de tasa por IP.
      security: []
      parameters:
        - name: tenantSlug
          in: query
          required: true
          schema: { type: string, maxLength: 60 }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Página de ítems públicos.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PublicItem" }
        "429": { $ref: "#/components/responses/Problem" }

  /public/orders:
    post:
      tags: [Storefront]
      operationId: public_orders_create
      summary: Crea un pedido web
      description: |
        Los **precios se recalculan en el servidor**; el cliente solo envía ítems y cantidades. Reserva stock con
        vencimiento y deja el pedido pendiente de confirmación.
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicOrderInput" }
      responses:
        "201":
          description: Pedido creado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicOrder" }
        "409":
          description: Stock insuficiente para alguna línea.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /integrations/catalog-feed/items:
    get:
      tags: [Integrations]
      operationId: integrations_catalog_feed_items
      summary: Alimentador de catálogo para motores externos de catálogos y reportes
      description: |
        Entrega los ítems con la información necesaria para generar catálogos: precio con IVA explícito, imágenes
        con URL firmada, disponible, tipo y componentes de kits. **Sin costos.**
      x-required-scopes: ["catalog:read"]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: onlyPublished
          in: query
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: Página de ítems para catálogo.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/CatalogFeedItem" }
        default: { $ref: "#/components/responses/Problem" }

  /integrations/webhook-endpoints:
    get:
      tags: [Integrations]
      operationId: integrations_webhooks_list
      summary: Lista suscripciones de webhooks
      x-required-scopes: ["webhooks:manage"]
      responses:
        "200":
          description: Suscripciones.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookEndpoint" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [Integrations]
      operationId: integrations_webhooks_create
      summary: Crea una suscripción de webhooks
      description: El secreto de firma se devuelve **una sola vez** en esta respuesta.
      x-required-scopes: ["webhooks:manage"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookEndpointInput" }
      responses:
        "201":
          description: Suscripción creada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpointCreated" }
        default: { $ref: "#/components/responses/Problem" }

  /sales/orders/{orderId}/credit-release:
    post:
      tags: [Receivables]
      operationId: sales_orders_credit_release
      summary: Libera un pedido retenido por crédito
      description: |
        Un pedido o factura a crédito queda en `CREDIT_HOLD` cuando excede el cupo o el cliente está en mora
        (R-CAR-012). Liberarlo exige permiso, **motivo obligatorio** y queda en la bitácora.
      x-required-scopes: ["credit:release"]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        "200":
          description: Pedido liberado.
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /sales/invoices/{invoiceId}/render-data:
    get:
      tags: [Integrations]
      operationId: sales_invoices_render_data
      summary: Datos canónicos del documento para un motor externo de renderizado
      description: |
        Entrega el documento ya calculado (importes como cadenas decimales) para que **cualquier motor externo**
        genere su representación gráfica. SIFCA no invoca al motor: este lo consume (p. ej. al recibir el
        webhook `invoice.accepted`).
      x-required-scopes: ["documents:read"]
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      responses:
        "200":
          description: Documento canónico.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanonicalDocument" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /sales/invoices/{invoiceId}/rendered-documents/{kind}:
    put:
      tags: [Integrations]
      operationId: sales_invoices_rendered_document_put
      summary: Adjunta un PDF generado por un motor externo
      description: |
        Permite que un motor externo devuelva la representación gráfica. Solo se acepta para facturas
        aceptadas; se guarda con su hash SHA-256 y no reemplaza al XML firmado (que es el documento legal).
      x-required-scopes: ["documents:write"]
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [PDF_ALTERNATE] }
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { type: string, format: binary }
      responses:
        "204":
          description: Adjunto guardado.
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /receivables/customers/{partyId}/credit:
    get:
      tags: [Receivables]
      operationId: receivables_customer_credit_get
      summary: Cupo, exposición, mora y estado de crédito de un cliente
      x-required-scopes: ["credit:read"]
      parameters:
        - $ref: "#/components/parameters/PartyId"
      responses:
        "200":
          description: Estado de crédito.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerCredit" }
        default: { $ref: "#/components/responses/Problem" }

  /parties/{partyId}/credit-terms:
    put:
      tags: [Parties]
      operationId: parties_credit_terms_put
      summary: Define el cupo de crédito y el plazo de pago de un cliente
      description: Exige permiso y deja el valor anterior y el nuevo en la bitácora (R-CAR-015).
      x-required-scopes: ["credit:write"]
      parameters:
        - $ref: "#/components/parameters/PartyId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreditTermsInput" }
      responses:
        "200":
          description: Condiciones actualizadas.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerCredit" }
        default: { $ref: "#/components/responses/Problem" }

  /inventory/items/{itemId}/costing:
    get:
      tags: [Inventory]
      operationId: inventory_item_costing_get
      summary: Método de costeo, valor y capas (PEPS) o promedio de un ítem
      x-required-scopes: ["inventory:read"]
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Costeo del ítem.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemCosting" }
        default: { $ref: "#/components/responses/Problem" }

  /inventory/abc:
    get:
      tags: [Inventory]
      operationId: inventory_abc_list
      summary: Clasificación ABC vigente (Pareto por valor de consumo y rotación)
      x-required-scopes: ["inventory:read"]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: finalClass
          in: query
          schema: { type: string, enum: [A, B, C] }
      responses:
        "200":
          description: Página de clasificaciones.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/AbcRow" }
        default: { $ref: "#/components/responses/Problem" }

  /inventory/reorder:
    get:
      tags: [Inventory]
      operationId: inventory_reorder_list
      summary: Punto de reorden, stock de seguridad, posición y cantidad sugerida
      x-required-scopes: ["inventory:read"]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: belowReorderPoint
          in: query
          description: Solo ítems con posición de inventario menor o igual al punto de reorden.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Página de métricas de reposición.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ReorderRow" }
        default: { $ref: "#/components/responses/Problem" }

  /purchases/bills/{billId}/returns:
    post:
      tags: [Inventory]
      operationId: purchases_bill_returns_create
      summary: Registra una devolución a proveedor
      description: |
        Sale de kardex al costo correspondiente (promedio: costo de la compra original; PEPS: capa de esa
        entrada), reduce la cuenta por pagar y reversa IVA descontable y retenciones en proporción (R-INV-045).
      x-required-scopes: ["purchases:write"]
      parameters:
        - name: billId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                reason: { type: string, maxLength: 500 }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [billLineNo, quantity]
                    properties:
                      billLineNo: { type: integer }
                      quantity: { $ref: "#/components/schemas/Decimal" }
      responses:
        "201":
          description: Devolución registrada.
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

webhooks:
  invoice.accepted:
    post:
      summary: La DIAN aceptó la factura
      description: |
        Entrega firmada con `SIFCA-Signature`. Reintentos con retroceso exponencial hasta 24 h. Al menos una
        vez; el receptor debe deduplicar por `id`.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookEvent" }
      responses:
        "2XX":
          description: Recibido.

  return.received:
    post:
      summary: Se emitió una nota crédito con reingreso al kardex
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookEvent" }
      responses:
        "2XX":
          description: Recibido.
  credit.hold.created:
    post:
      summary: Un documento quedó retenido por cupo excedido o mora
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookEvent" }
      responses:
        "2XX":
          description: Recibido.
  inventory.reorder.required:
    post:
      summary: La posición de inventario de un ítem cruzó su punto de reorden
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookEvent" }
      responses:
        "2XX":
          description: Recibido.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acceso de usuario (vida corta).
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API Key de integración; sus alcances (scopes) limitan lo que puede hacer.

  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      description: Cursor opaco devuelto en `page.nextCursor`.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Misma clave y mismo cuerpo ⇒ misma respuesta durante 24 h; misma clave y otro cuerpo ⇒ 422.
      schema: { type: string, minLength: 8, maxLength: 128 }
    PartyId:
      name: partyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Problem:
      description: Error (RFC 9457).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Decimal:
      type: string
      pattern: '^-?\d+(\.\d+)?$'
      description: Número decimal exacto como cadena.
      examples: ["1190000.00"]
    Money:
      allOf:
        - $ref: "#/components/schemas/Decimal"
      description: Importe en COP con 2 decimales.
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference, description: Identifica la clase de error. }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          description: Código estable legible por máquina.
          examples: [INSUFFICIENT_STOCK, NUMBERING_RANGE_EXHAUSTED, PERIOD_CLOSED, VALIDATION_FAILED, CREDIT_LIMIT_EXCEEDED, CUSTOMER_BLOCKED_OVERDUE, RETURN_EXCEEDS_SOLD, COSTING_METHOD_NOT_ALLOWED]
        requestId: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
    PageEnvelope:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: {} }
        page:
          type: object
          required: [hasMore]
          properties:
            nextCursor: { type: [string, "null"] }
            hasMore: { type: boolean }
    PartyKind:
      type: string
      enum: [CUSTOMER, SUPPLIER, EMPLOYEE, OTHER]
    Party:
      type: object
      required: [id, kind, idType, idNumber, legalName]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: array
          items: { $ref: "#/components/schemas/PartyKind" }
        idType: { type: string, enum: [NIT, CC, CE, PAS, TI, RC, NUIP, DIE, OTHER] }
        idNumber: { type: string }
        dv: { type: [string, "null"], description: Dígito de verificación (NIT). }
        legalName: { type: string }
        tradeName: { type: [string, "null"] }
        email: { type: [string, "null"], format: email }
        phone: { type: [string, "null"] }
        fiscalResponsibilities:
          type: array
          items: { type: string }
          examples: [["O-13", "O-15"]]
        isIncomeDeclarant: { type: boolean }
        isWithholdingAgent: { type: boolean }
        creditLimit: { $ref: "#/components/schemas/Money" }
        paymentTermDays: { type: integer, minimum: 0, maximum: 365 }
        creditStatus: { $ref: "#/components/schemas/CreditStatus" }
    PartyInput:
      type: object
      required: [kind, idType, idNumber, legalName]
      properties:
        kind:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PartyKind" }
        idType: { type: string }
        idNumber: { type: string, maxLength: 20 }
        legalName: { type: string, maxLength: 200 }
        tradeName: { type: string, maxLength: 200 }
        email: { type: string, format: email }
        phone: { type: string, maxLength: 30 }
        fiscalResponsibilities:
          type: array
          items: { type: string }
        isIncomeDeclarant: { type: boolean }
        isWithholdingAgent: { type: boolean }
    Item:
      type: object
      required: [id, sku, name, itemType, status]
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        itemType:
          type: string
          enum: [SIMPLE, SERVICE, KIT, VARIANT_PARENT, VARIANT]
        categoryId: { type: [string, "null"], format: uuid }
        tracksInventory: { type: boolean }
        tracksLots: { type: boolean }
        tracksExpiry: { type: boolean, description: "Perecedero: obliga a costeo FIFO (R-INV-001)." }
        costingMethod: { $ref: "#/components/schemas/CostingMethod" }
        pickingPolicy: { $ref: "#/components/schemas/PickingPolicy" }
        abcClass: { type: [string, "null"], enum: [A, B, C, null] }
        taxCode: { type: string, examples: [IVA19] }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        prices:
          type: array
          items:
            type: object
            required: [priceListId, price, includesTax]
            properties:
              priceListId: { type: string, format: uuid }
              price: { $ref: "#/components/schemas/Money" }
              includesTax: { type: boolean }
    StockBalance:
      type: object
      required: [itemId, warehouseId, onHand, reserved, available]
      properties:
        itemId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        lotId: { type: [string, "null"], format: uuid }
        onHand: { $ref: "#/components/schemas/Decimal" }
        reserved: { $ref: "#/components/schemas/Decimal" }
        available: { $ref: "#/components/schemas/Decimal" }
    DocumentStatus:
      type: string
      enum: [DRAFT, ISSUED, TRANSMITTING, ACCEPTED, ACCEPTED_WITH_NOTES, REJECTED, CANCELLED]
    InvoiceLineInput:
      type: object
      required: [itemId, quantity, unitPrice]
      properties:
        itemId: { type: string, format: uuid }
        description: { type: string, maxLength: 500 }
        quantity: { $ref: "#/components/schemas/Decimal" }
        unitPrice: { $ref: "#/components/schemas/Money" }
        discountAmount: { $ref: "#/components/schemas/Money" }
        warehouseId: { type: string, format: uuid }
        lotId: { type: string, format: uuid }
    InvoiceDraftInput:
      type: object
      required: [customerId, lines]
      properties:
        customerId: { type: string, format: uuid }
        issueDate: { type: string, format: date }
        paymentForm: { type: string, enum: [CONTADO, CREDITO] }
        paymentTermDays: { type: integer, minimum: 0, maximum: 365 }
        paymentMethodCode: { type: string }
        numberingRangeId: { type: string, format: uuid }
        notes: { type: string, maxLength: 1000 }
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/InvoiceLineInput" }
    TaxLine:
      type: object
      required: [taxCode, base, ratePercent, amount]
      properties:
        taxCode: { type: string }
        base: { $ref: "#/components/schemas/Money" }
        ratePercent: { $ref: "#/components/schemas/Decimal" }
        amount: { $ref: "#/components/schemas/Money" }
    InvoiceLine:
      allOf:
        - $ref: "#/components/schemas/InvoiceLineInput"
        - type: object
          required: [lineNo, lineSubtotal]
          properties:
            lineNo: { type: integer }
            lineSubtotal: { $ref: "#/components/schemas/Money" }
            taxes:
              type: array
              items: { $ref: "#/components/schemas/TaxLine" }
    Invoice:
      type: object
      required: [id, status, customerId, subtotal, taxTotal, total, lines]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/DocumentStatus" }
        prefix: { type: [string, "null"] }
        number: { type: [integer, "null"], format: int64 }
        fullNumber: { type: [string, "null"] }
        customerId: { type: string, format: uuid }
        issuedAt: { type: [string, "null"], format: date-time }
        dueDate: { type: [string, "null"], format: date }
        paymentForm: { type: string, enum: [CONTADO, CREDITO] }
        creditHoldStatus: { type: string, enum: [NONE, HELD, RELEASED] }
        subtotal: { $ref: "#/components/schemas/Money" }
        taxTotal: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/InvoiceLine" }
        taxes:
          type: array
          items: { $ref: "#/components/schemas/TaxLine" }
        fiscal:
          type: [object, "null"]
          description: Datos fiscales; presente cuando la DIAN respondió.
          properties:
            cufe: { type: string }
            validatedAt: { type: string, format: date-time }
            messages:
              type: array
              items:
                type: object
                properties:
                  severity: { type: string, enum: [REJECTION, NOTIFICATION] }
                  code: { type: string }
                  message: { type: string }
    CreditNoteInput:
      type: object
      required: [conceptCode, lines]
      properties:
        conceptCode:
          type: string
          description: Concepto de corrección de la tabla oficial (devolución, anulación, descuento…).
        reason: { type: string, maxLength: 500 }
        writeOffOnReturn:
          type: boolean
          description: Si es `true`, lo averiado o vencido se da de baja en la misma transacción (R-INV-041).
          default: false
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [invoiceLineNo, quantity, condition]
            properties:
              invoiceLineNo: { type: integer }
              quantity:
                allOf:
                  - $ref: "#/components/schemas/Decimal"
                description: Positiva y no mayor que lo vendido menos lo ya devuelto (R-INV-040).
              condition:
                type: string
                enum: [RESELLABLE, DAMAGED, EXPIRED]
                description: Estado del producto devuelto; decide a qué bodega reingresa.
              warehouseId: { type: string, format: uuid }
    ReceiptInput:
      type: object
      required: [partyId, receiptDate, amount, paymentMethod, allocations]
      properties:
        partyId: { type: string, format: uuid }
        receiptDate: { type: string, format: date }
        amount: { $ref: "#/components/schemas/Money" }
        paymentMethod: { type: string }
        bankAccountId: { type: string, format: uuid }
        withholdingsSuffered:
          type: array
          items:
            type: object
            required: [taxCode, amount]
            properties:
              taxCode: { type: string, examples: [RETEFUENTE, RETEIVA, RETEICA] }
              amount: { $ref: "#/components/schemas/Money" }
        allocations:
          type: array
          items:
            type: object
            required: [invoiceId, amount]
            properties:
              invoiceId: { type: string, format: uuid }
              amount: { $ref: "#/components/schemas/Money" }
    Receipt:
      allOf:
        - $ref: "#/components/schemas/ReceiptInput"
        - type: object
          required: [id, number, journalEntryId]
          properties:
            id: { type: string, format: uuid }
            number: { type: string }
            journalEntryId: { type: string, format: uuid }
            unappliedAmount: { $ref: "#/components/schemas/Money" }
    AccountStatement:
      type: object
      required: [partyId, asOf, balance, buckets]
      properties:
        partyId: { type: string, format: uuid }
        asOf: { type: string, format: date }
        balance: { $ref: "#/components/schemas/Money" }
        buckets:
          type: array
          items:
            type: object
            required: [label, amount]
            properties:
              label: { type: string, examples: ["1-30", "31-60"] }
              amount: { $ref: "#/components/schemas/Money" }
        openDocuments:
          type: array
          items:
            type: object
            properties:
              invoiceId: { type: string, format: uuid }
              fullNumber: { type: string }
              dueDate: { type: string, format: date }
              pending: { $ref: "#/components/schemas/Money" }
              daysOverdue: { type: integer }
    TrialBalance:
      type: object
      required: [from, to, rows, totals]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        rows:
          type: array
          items:
            type: object
            required: [accountCode, accountName, openingBalance, debit, credit, closingBalance]
            properties:
              accountCode: { type: string }
              accountName: { type: string }
              openingBalance: { $ref: "#/components/schemas/Money" }
              debit: { $ref: "#/components/schemas/Money" }
              credit: { $ref: "#/components/schemas/Money" }
              closingBalance: { $ref: "#/components/schemas/Money" }
        totals:
          type: object
          required: [debit, credit]
          properties:
            debit: { $ref: "#/components/schemas/Money" }
            credit: { $ref: "#/components/schemas/Money" }
    PublicItem:
      type: object
      required: [id, name, price, available]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        price: { $ref: "#/components/schemas/Money" }
        priceIncludesTax: { type: boolean }
        imageUrls:
          type: array
          items: { type: string, format: uri }
        available: { type: boolean }
        category: { type: [string, "null"] }
    PublicOrderInput:
      type: object
      required: [tenantSlug, customer, lines]
      properties:
        tenantSlug: { type: string }
        customer:
          type: object
          required: [name, email, phone]
          properties:
            name: { type: string, maxLength: 200 }
            email: { type: string, format: email }
            phone: { type: string, maxLength: 30 }
            idType: { type: string }
            idNumber: { type: string }
            address: { type: string, maxLength: 300 }
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [itemId, quantity]
            properties:
              itemId: { type: string, format: uuid }
              quantity: { $ref: "#/components/schemas/Decimal" }
        notes: { type: string, maxLength: 500 }
        acceptedDataPolicy:
          type: boolean
          description: Autorización de tratamiento de datos (Ley 1581 de 2012). Debe ser `true`.
    PublicOrder:
      type: object
      required: [id, status, total, reservedUntil]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [PENDING_CONFIRMATION, CONFIRMED, CANCELLED, EXPIRED] }
        total: { $ref: "#/components/schemas/Money" }
        reservedUntil: { type: string, format: date-time }
    CatalogFeedItem:
      type: object
      required: [id, name, price, priceIncludesTax, available]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        categoryId: { type: [string, "null"] }
        categoryName: { type: [string, "null"] }
        itemType: { type: string, enum: [SIMPLE, SERVICE, KIT, VARIANT_PARENT, VARIANT] }
        price: { $ref: "#/components/schemas/Money" }
        priceIncludesTax: { type: boolean }
        availableQuantity: { $ref: "#/components/schemas/Decimal" }
        available: { type: boolean }
        images:
          type: array
          items:
            type: object
            required: [url]
            properties:
              url: { type: string, format: uri }
              favorite: { type: boolean }
        components:
          type: array
          description: Componentes si es un kit.
          items:
            type: object
            properties:
              itemId: { type: string }
              name: { type: string }
              quantity: { $ref: "#/components/schemas/Decimal" }
    WebhookEndpointInput:
      type: object
      required: [url, eventTypes]
      properties:
        url: { type: string, format: uri, description: Debe ser HTTPS. }
        eventTypes:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - invoice.issued
              - invoice.accepted
              - invoice.rejected
              - stock.changed
              - order.created
              - receipt.registered
              - return.received
              - credit.limit.warning
              - credit.limit.exceeded
              - credit.hold.created
              - credit.hold.released
              - receivable.overdue
              - inventory.reorder.required
              - inventory.abc.reclassified
        description: { type: string, maxLength: 200 }
    WebhookEndpoint:
      allOf:
        - $ref: "#/components/schemas/WebhookEndpointInput"
        - type: object
          required: [id, isActive]
          properties:
            id: { type: string, format: uuid }
            isActive: { type: boolean }
    WebhookEndpointCreated:
      allOf:
        - $ref: "#/components/schemas/WebhookEndpoint"
        - type: object
          required: [signingSecret]
          properties:
            signingSecret:
              type: string
              description: Se muestra una sola vez.
    WebhookEvent:
      type: object
      required: [id, type, createdAt, data]
      properties:
        id: { type: string, format: uuid, description: Identificador del evento (para deduplicar). }
        type: { type: string, examples: [invoice.accepted] }
        createdAt: { type: string, format: date-time }
        tenantId: { type: string, format: uuid }
        data:
          type: object
          description: Cuerpo mínimo del recurso; use la API para obtener el detalle.
          additionalProperties: true
    CreditStatus:
      type: string
      enum: [AL_DIA, ALERTA, BLOQUEADO_CUPO, BLOQUEADO_MORA, SUSPENDIDO]
    CreditTermsInput:
      type: object
      required: [creditLimit, paymentTermDays]
      properties:
        creditLimit:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Cupo máximo de exposición; `"0.00"` = sin crédito (solo contado). No puede ser negativo.
        paymentTermDays: { type: integer, minimum: 0, maximum: 365 }
        suspended: { type: boolean }
        reason: { type: string, maxLength: 500 }
    CustomerCredit:
      type: object
      required: [partyId, creditLimit, exposure, availableCredit, status]
      properties:
        partyId: { type: string, format: uuid }
        creditLimit: { $ref: "#/components/schemas/Money" }
        paymentTermDays: { type: integer }
        exposure:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Cartera pendiente + pedidos a crédito confirmados sin facturar − saldos a favor (R-CAR-008).
        availableCredit: { $ref: "#/components/schemas/Money" }
        maxDaysOverdue: { type: integer, minimum: 0 }
        status: { $ref: "#/components/schemas/CreditStatus" }
        agingBuckets:
          type: array
          items:
            type: object
            required: [label, amount]
            properties:
              label: { type: string, enum: [Corriente, "30", "60", "90", "90+"] }
              amount: { $ref: "#/components/schemas/Money" }
    CostingMethod:
      type: string
      enum: [WEIGHTED_AVERAGE, FIFO]
      description: |
        Método de costeo financiero. **LIFO/UEPS no es un valor válido**: solo existe como política de
        despacho físico (R-INV-001, R-INV-017).
    PickingPolicy:
      type: string
      enum: [FEFO, FIFO, LIFO, MANUAL]
      description: Política de despacho físico; no afecta el costeo.
    ItemCosting:
      type: object
      required: [itemId, costingMethod, quantityOnHand, totalValue]
      properties:
        itemId: { type: string, format: uuid }
        costingMethod: { $ref: "#/components/schemas/CostingMethod" }
        quantityOnHand: { $ref: "#/components/schemas/Decimal" }
        totalValue: { $ref: "#/components/schemas/Money" }
        averageUnitCost:
          type: [string, "null"]
          description: Solo en `WEIGHTED_AVERAGE`; derivado de `totalValue / quantityOnHand` (6 decimales).
        layers:
          type: array
          description: Solo en `FIFO`; capas con saldo, en orden de consumo.
          items:
            type: object
            required: [receivedOn, remainingQuantity, unitCost]
            properties:
              receivedOn: { type: string, format: date }
              lotCode: { type: [string, "null"] }
              remainingQuantity: { $ref: "#/components/schemas/Decimal" }
              unitCost: { $ref: "#/components/schemas/Decimal" }
    AbcRow:
      type: object
      required: [itemId, consumptionValue, paretoClass, finalClass]
      properties:
        itemId: { type: string, format: uuid }
        computedOn: { type: string, format: date }
        consumptionValue: { $ref: "#/components/schemas/Money" }
        sharePercent: { $ref: "#/components/schemas/Decimal" }
        cumulativeBeforePercent: { $ref: "#/components/schemas/Decimal" }
        paretoClass: { type: string, enum: [A, B, C] }
        turns: { $ref: "#/components/schemas/Decimal" }
        rotationClass: { type: string, enum: [HIGH, MEDIUM, LOW] }
        finalClass: { type: string, enum: [A, B, C] }
        flag: { type: [string, "null"], enum: [NEW, NO_ROTATION, null] }
    ReorderRow:
      type: object
      required: [itemId, reorderPoint, position]
      properties:
        itemId: { type: string, format: uuid }
        avgDailyDemand: { $ref: "#/components/schemas/Decimal" }
        leadTimeDays: { $ref: "#/components/schemas/Decimal" }
        serviceLevel: { $ref: "#/components/schemas/Decimal" }
        safetyStock: { $ref: "#/components/schemas/Decimal" }
        reorderPoint:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          description: "ROP = d × L + SS (R-INV-032)."
        position:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          description: Disponible + cantidades en órdenes de compra abiertas (R-INV-033).
        suggestedOrderQuantity: { $ref: "#/components/schemas/Decimal" }
        confidence: { type: string, enum: [NORMAL, LOW_CONFIDENCE] }
    CanonicalDocument:
      type: object
      description: Documento ya calculado; los importes son cadenas decimales (SIFCA es quien suma y redondea).
      required: [issuer, document, lines, totals]
      properties:
        issuer: { $ref: "#/components/schemas/DocumentParty" }
        customer: { $ref: "#/components/schemas/DocumentParty" }
        document:
          type: object
          required: [kind, fullNumber, issuedAt, currency]
          properties:
            kind: { type: string, enum: [invoice, credit_note, debit_note, quote, receipt, account_statement] }
            prefix: { type: string }
            number: { type: string }
            fullNumber: { type: string }
            issuedAt: { type: string, format: date-time }
            dueDate: { type: string, format: date }
            paymentForm: { type: string, enum: [CONTADO, CREDITO] }
            paymentMethod: { type: string }
            currency: { type: string, enum: [COP] }
            notes: { type: string }
        lines:
          type: array
          items:
            type: object
            required: [lineNo, description, quantity, unitPrice, lineTotal]
            properties:
              lineNo: { type: integer }
              code: { type: string }
              description: { type: string }
              unit: { type: string }
              quantity: { $ref: "#/components/schemas/Decimal" }
              unitPrice: { $ref: "#/components/schemas/Decimal" }
              discount: { $ref: "#/components/schemas/Decimal" }
              lineTotal: { $ref: "#/components/schemas/Decimal" }
        totals:
          type: object
          required: [subtotal, total, payable]
          properties:
            subtotal: { $ref: "#/components/schemas/Decimal" }
            discounts: { $ref: "#/components/schemas/Decimal" }
            taxes:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  base: { $ref: "#/components/schemas/Decimal" }
                  amount: { $ref: "#/components/schemas/Decimal" }
            total: { $ref: "#/components/schemas/Decimal" }
            payable: { $ref: "#/components/schemas/Decimal" }
            amountInWords: { type: string }
        fiscal:
          type: object
          description: Obligatorio en documentos electrónicos de la DIAN.
          properties:
            cufe: { type: string }
            qrData: { type: string }
            qrUrl: { type: string, format: uri }
            validatedAt: { type: string, format: date-time }
            numbering:
              type: object
              properties:
                resolution: { type: string }
                resolutionDate: { type: string, format: date }
                prefix: { type: string }
                from: { type: string }
                to: { type: string }
                validUntil: { type: string, format: date }
    DocumentParty:
      type: object
      required: [legalName]
      properties:
        legalName: { type: string }
        tradeName: { type: string }
        idType: { type: string }
        idNumber: { type: string }
        dv: { type: string }
        address: { type: string }
        city: { type: string }
        email: { type: string }
        phones:
          type: array
          items: { type: string }
        fiscalResponsibilities:
          type: array
          items: { type: string }
