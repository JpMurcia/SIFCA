openapi: 3.1.0
info:
  title: SIFCA API — Contabilidad (spec 001)
  version: 0.1.0-draft
  summary: Contrato HTTP del módulo accounting (comprobantes inmutables, períodos y balance de prueba).
  description: |
    **Contrato de diseño** de la spec 001. Es un recorte del borrador global
    (`docs/01-arquitectura/openapi/sifca.v1.draft.yaml`) y sigue sus convenciones; cuando exista código, la fuente de
    verdad será el OpenAPI generado por NestJS a partir de los esquemas Zod de `packages/contracts`, comparado en
    CI contra este archivo.

    - Importes como **cadenas decimales** (`"1190000.00"`), nunca números.
    - Fechas contables `YYYY-MM-DD` (sin zona); instantes ISO 8601 en UTC.
    - Errores `application/problem+json` (RFC 9457) con `code` estable.
    - Un comprobante **no se edita ni se elimina**: `PUT`, `PATCH` y `DELETE` sobre él responden `405 ENTRY_IMMUTABLE`.
  license:
    name: Propietaria
    identifier: LicenseRef-Proprietary
servers:
  - url: "{baseUrl}/api/v1"
    variables:
      baseUrl:
        default: http://localhost:3000
tags:
  - name: Accounting
    description: Comprobantes, períodos y reservas de numeración.
  - name: Reports
    description: Diario, mayor y balance de prueba.
security:
  - bearerAuth: []
paths:
  /accounting/accounts:
    get:
      tags: [Accounting]
      operationId: accounts_list
      summary: Lista cuentas del plan de cuentas
      x-required-permission: accounting.report.read
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: q
          in: query
          description: Búsqueda por código o nombre.
          schema: { type: string, maxLength: 100 }
        - name: postableOnly
          in: query
          description: Solo cuentas de movimiento activas.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Página de cuentas.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Account" }
        default: { $ref: "#/components/responses/Problem" }

  /accounting/voucher-types:
    get:
      tags: [Accounting]
      operationId: voucher_types_list
      summary: Lista tipos de comprobante y su siguiente consecutivo
      x-required-permission: accounting.report.read
      responses:
        "200":
          description: Tipos de comprobante.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/VoucherType" }
        default: { $ref: "#/components/responses/Problem" }

  /accounting/journal-entries:
    post:
      tags: [Accounting]
      operationId: journal_entries_post
      summary: Contabiliza un comprobante
      description: |
        Valida el comprobante (R-CON-001…009), asigna el consecutivo del tipo y lo guarda en una sola transacción.
        Un fallo no consume consecutivo. Con `Idempotency-Key`, un reintento con el mismo cuerpo devuelve el
        comprobante ya creado (`200`).
      x-required-permission: accounting.entry.post
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostJournalEntryRequest" }
      responses:
        "201":
          description: Comprobante contabilizado.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntry" }
        "200":
          description: Reintento idempotente; se devuelve el comprobante existente.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntry" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    get:
      tags: [Accounting]
      operationId: journal_entries_list
      summary: Lista comprobantes (más recientes primero)
      x-required-permission: accounting.report.read
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: voucherType
          in: query
          schema: { type: string, pattern: '^[A-Z]{1,5}$' }
        - name: accountCode
          in: query
          schema: { type: string, pattern: '^[0-9]{1,12}$' }
        - name: sourceType
          in: query
          schema: { $ref: "#/components/schemas/SourceType" }
      responses:
        "200":
          description: Página de comprobantes (sin líneas).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/JournalEntrySummary" }
        default: { $ref: "#/components/responses/Problem" }

  /accounting/journal-entries/{entryId}:
    parameters:
      - $ref: "#/components/parameters/EntryId"
    get:
      tags: [Accounting]
      operationId: journal_entries_get
      summary: Obtiene un comprobante con sus líneas
      x-required-permission: accounting.report.read
      responses:
        "200":
          description: Comprobante.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntry" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [Accounting]
      operationId: journal_entries_put_forbidden
      summary: No permitido — los comprobantes son inmutables
      description: Siempre responde `405` con `code = ENTRY_IMMUTABLE`. La corrección es una reversión.
      responses:
        "405": { $ref: "#/components/responses/EntryImmutable" }
    patch:
      tags: [Accounting]
      operationId: journal_entries_patch_forbidden
      summary: No permitido — los comprobantes son inmutables
      responses:
        "405": { $ref: "#/components/responses/EntryImmutable" }
    delete:
      tags: [Accounting]
      operationId: journal_entries_delete_forbidden
      summary: No permitido — los comprobantes son inmutables
      responses:
        "405": { $ref: "#/components/responses/EntryImmutable" }

  /accounting/journal-entries/{entryId}/reversal:
    parameters:
      - $ref: "#/components/parameters/EntryId"
    post:
      tags: [Accounting]
      operationId: journal_entries_reverse
      summary: Reversa un comprobante (contraasiento)
      description: |
        Crea un comprobante de reversión con los lados invertidos que referencia al original. El efecto neto de
        ambos sobre cada cuenta es cero. Un comprobante se reversa una sola vez (`ALREADY_REVERSED`), lo que hace la
        operación segura ante reintentos sin necesidad de `Idempotency-Key`.
      x-required-permission: accounting.entry.reverse
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReverseJournalEntryRequest" }
      responses:
        "201":
          description: Comprobante de reversión.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntry" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /accounting/journal-drafts:
    post:
      tags: [Accounting]
      operationId: journal_drafts_create
      summary: Guarda un borrador (admite descuadre)
      x-required-permission: accounting.entry.post
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveJournalDraftRequest" }
      responses:
        "201":
          description: Borrador creado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalDraft" }
        "422": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    get:
      tags: [Accounting]
      operationId: journal_drafts_list
      summary: Lista borradores
      x-required-permission: accounting.entry.post
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: periodId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Página de borradores.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/JournalDraft" }
        default: { $ref: "#/components/responses/Problem" }

  /accounting/journal-drafts/{draftId}:
    parameters:
      - name: draftId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Accounting]
      operationId: journal_drafts_replace
      summary: Reemplaza el contenido de un borrador
      x-required-permission: accounting.entry.post
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveJournalDraftRequest" }
      responses:
        "200":
          description: Borrador actualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalDraft" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [Accounting]
      operationId: journal_drafts_discard
      summary: Descarta un borrador
      x-required-permission: accounting.entry.post
      responses:
        "204": { description: Borrador descartado. }
        "404": { $ref: "#/components/responses/Problem" }

  /accounting/fiscal-years:
    post:
      tags: [Accounting]
      operationId: fiscal_years_create
      summary: Crea los 12 períodos mensuales de un año
      x-required-permission: accounting.period.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year]
              additionalProperties: false
              properties:
                year: { type: integer, minimum: 2000, maximum: 2100 }
      responses:
        "201":
          description: Períodos creados (todos `OPEN`).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    minItems: 12
                    maxItems: 12
                    items: { $ref: "#/components/schemas/FiscalPeriod" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /accounting/fiscal-years/{year}/closing:
    parameters:
      - name: year
        in: path
        required: true
        schema: { type: integer, minimum: 2000, maximum: 2100 }
    post:
      tags: [Accounting]
      operationId: fiscal_years_close
      summary: Cierre anual (cancela cuentas de resultado contra ganancias y pérdidas)
      description: |
        Genera y contabiliza un comprobante de cierre normal (`YEAR_CLOSING`), reversible. R-CON-012 está 🔶:
        las cuentas de destino se parametrizan por empresa.
      x-required-permission: accounting.year.close
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profitAndLossAccountId, yearResultAccountId, accountingDate]
              additionalProperties: false
              properties:
                profitAndLossAccountId: { type: string, format: uuid }
                yearResultAccountId: { type: string, format: uuid }
                accountingDate: { type: string, format: date }
      responses:
        "201":
          description: Comprobante de cierre.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntry" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /accounting/periods:
    get:
      tags: [Accounting]
      operationId: periods_list
      summary: Lista períodos contables
      x-required-permission: accounting.report.read
      parameters:
        - name: year
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Períodos.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/FiscalPeriod" }

  /accounting/periods/{periodId}/close:
    parameters:
      - $ref: "#/components/parameters/PeriodId"
    post:
      tags: [Accounting]
      operationId: periods_close
      summary: Cierra un período
      description: |
        Exige balance cuadrado, ausencia de borradores y que pasen los `PeriodCloseCheck` registrados (R-CON-011).
        Queda en la bitácora. Si no se cumple, `409 PERIOD_CLOSE_BLOCKED` con las causas en `errors[]`.
      x-required-permission: accounting.period.close
      responses:
        "200":
          description: Período cerrado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FiscalPeriod" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /accounting/periods/{periodId}/reopen:
    parameters:
      - $ref: "#/components/parameters/PeriodId"
    post:
      tags: [Accounting]
      operationId: periods_reopen
      summary: Reabre un período cerrado (excepcional)
      x-required-permission: accounting.period.reopen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        "200":
          description: Período reabierto.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FiscalPeriod" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /accounting/reports/journal:
    get:
      tags: [Reports]
      operationId: reports_journal
      summary: Libro diario (cronológico)
      description: Mismo rango y mismos datos ⇒ mismo resultado (R-CON-010).
      x-required-permission: accounting.report.read
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Líneas en orden cronológico.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/JournalBookRow" }
        "422": { $ref: "#/components/responses/Problem" }

  /accounting/reports/general-ledger:
    get:
      tags: [Reports]
      operationId: reports_general_ledger
      summary: Libro mayor de una cuenta con saldo acumulado
      x-required-permission: accounting.report.read
      parameters:
        - { name: accountCode, in: query, required: true, schema: { type: string, pattern: '^[0-9]{1,12}$' } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Saldo inicial, movimientos con saldo acumulado y saldo final.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeneralLedger" }
        "422": { $ref: "#/components/responses/Problem" }

  /accounting/reports/trial-balance:
    get:
      tags: [Reports]
      operationId: reports_trial_balance
      summary: Balance de prueba
      description: |
        Saldo inicial, movimiento y saldo final por cuenta. El saldo final se presenta en la columna donde queda
        positivo; si es contrario a la naturaleza de la cuenta se marca `contraNature = true` (R-CON-013).
      x-required-permission: accounting.report.read
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - name: level
          in: query
          description: Nivel de acumulación por prefijo del código (1, 2, 4, 6 u 8). Sin valor, cuentas de movimiento.
          schema: { type: integer, enum: [1, 2, 4, 6, 8] }
      responses:
        "200":
          description: Balance de prueba.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrialBalance" }
        "422": { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      description: Cursor opaco devuelto en `page.nextCursor`.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Misma clave y mismo cuerpo ⇒ misma respuesta; misma clave y otro cuerpo ⇒ `422 IDEMPOTENCY_CONFLICT`.
      schema: { type: string, minLength: 8, maxLength: 128 }
    EntryId:
      name: entryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PeriodId:
      name: periodId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Problem:
      description: Error (RFC 9457).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    EntryImmutable:
      description: Los comprobantes contabilizados no se editan ni se eliminan; se corrigen con una reversión.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: https://sifca.example/problems/entry-immutable
            title: El comprobante es inmutable
            status: 405
            code: ENTRY_IMMUTABLE
            detail: Use POST /accounting/journal-entries/{entryId}/reversal.
  schemas:
    Money:
      type: string
      pattern: '^\d+(\.\d{1,2})?$'
      description: Importe en COP, no negativo, hasta 2 decimales, como cadena.
      examples: ["1190000.00"]
    SignedMoney:
      type: string
      pattern: '^-?\d+(\.\d{1,2})?$'
      description: Importe con signo (saldos); cadena decimal.
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          enum:
            - ENTRY_NOT_BALANCED
            - VALIDATION_FAILED
            - PERIOD_CLOSED
            - PERIOD_NOT_FOUND
            - ALREADY_REVERSED
            - ENTRY_IMMUTABLE
            - PERIOD_CLOSE_BLOCKED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - IDEMPOTENCY_CONFLICT
            - UNAUTHENTICATED
            - INTERNAL_ERROR
        requestId: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
              rule:
                type: string
                description: Regla del catálogo que se incumplió.
                examples: [R-CON-001]
    PageEnvelope:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: {} }
        page:
          type: object
          required: [hasMore]
          properties:
            nextCursor: { type: [string, "null"] }
            hasMore: { type: boolean }
    SourceType:
      type: string
      enum: [MANUAL, SALES_DOCUMENT, RECEIPT, PURCHASE_DOCUMENT, STOCK_ADJUSTMENT, YEAR_CLOSING, REVERSAL]
    Account:
      type: object
      required: [id, code, name, level, nature, allowsPosting, requiresParty, requiresCostCenter, isActive]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, pattern: '^[0-9]{1,12}$' }
        name: { type: string }
        parentId: { type: [string, "null"], format: uuid }
        level: { type: integer, minimum: 1 }
        nature: { type: string, enum: [DEBIT, CREDIT] }
        allowsPosting: { type: boolean }
        requiresParty: { type: boolean }
        requiresCostCenter: { type: boolean }
        isActive: { type: boolean }
    VoucherType:
      type: object
      required: [id, code, name, numberingScope, nextNumber]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, pattern: '^[A-Z]{1,5}$' }
        name: { type: string }
        numberingScope: { type: string, enum: [TENANT, YEAR] }
        nextNumber:
          type: integer
          minimum: 1
          description: Orientativo; el número real se asigna al contabilizar.
    FiscalPeriod:
      type: object
      required: [id, year, month, startsOn, endsOn, status]
      properties:
        id: { type: string, format: uuid }
        year: { type: integer }
        month: { type: integer, minimum: 1, maximum: 12 }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        status: { type: string, enum: [OPEN, CLOSED] }
        closedAt: { type: [string, "null"], format: date-time }
        closedBy: { type: [string, "null"], format: uuid }
    JournalLineInput:
      type: object
      required: [accountCode]
      additionalProperties: false
      properties:
        accountCode: { type: string, pattern: '^[0-9]{1,12}$' }
        partyId: { type: [string, "null"], format: uuid }
        costCenterCode: { type: [string, "null"], maxLength: 20 }
        debit: { $ref: "#/components/schemas/Money" }
        credit: { $ref: "#/components/schemas/Money" }
        description: { type: string, maxLength: 500 }
        documentRef: { type: string, maxLength: 60 }
        dueDate: { type: [string, "null"], format: date }
      description: |
        Exactamente un lado debe ser mayor que cero; el otro se omite o es `"0.00"` (R-CON-002).
    PostJournalEntryRequest:
      type: object
      required: [voucherType, description, lines]
      additionalProperties: false
      properties:
        voucherType: { type: string, pattern: '^[A-Z]{1,5}$', examples: [AJ] }
        accountingDate:
          type: string
          format: date
          description: Fecha contable. Si se omite se usa `occurredAt` convertido a hora de Colombia, o hoy.
        occurredAt:
          type: string
          format: date-time
          description: Instante del hecho (UTC); de él se deriva la fecha contable en `America/Bogota` (R-CON-014).
        description: { type: string, minLength: 1, maxLength: 500 }
        source:
          type: object
          description: Documento fuente; obligatorio salvo `MANUAL` (R-CON-007).
          required: [type]
          additionalProperties: false
          properties:
            type: { $ref: "#/components/schemas/SourceType" }
            id: { type: string, format: uuid }
        lines:
          type: array
          minItems: 2
          maxItems: 500
          items: { $ref: "#/components/schemas/JournalLineInput" }
    ReverseJournalEntryRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 5, maxLength: 500 }
        accountingDate:
          type: string
          format: date
          description: Si se omite, hoy en hora de Colombia; debe caer en un período abierto.
    JournalLine:
      type: object
      required: [id, lineNo, accountCode, debit, credit]
      properties:
        id: { type: string, format: uuid }
        lineNo: { type: integer, minimum: 1 }
        accountCode: { type: string }
        accountName: { type: string }
        partyId: { type: [string, "null"], format: uuid }
        costCenterCode: { type: [string, "null"] }
        debit: { $ref: "#/components/schemas/Money" }
        credit: { $ref: "#/components/schemas/Money" }
        description: { type: [string, "null"] }
        documentRef: { type: [string, "null"] }
        dueDate: { type: [string, "null"], format: date }
    JournalEntrySummary:
      type: object
      required: [id, voucherType, number, accountingDate, status, totalDebit, totalCredit, sourceType, description]
      properties:
        id: { type: string, format: uuid }
        voucherType: { type: string }
        number: { type: integer, minimum: 1 }
        numberingYear: { type: integer }
        accountingDate: { type: string, format: date }
        fiscalPeriodId: { type: string, format: uuid }
        description: { type: string }
        sourceType: { $ref: "#/components/schemas/SourceType" }
        sourceId: { type: [string, "null"], format: uuid }
        status: { type: string, enum: [POSTED] }
        reversalOf: { type: [string, "null"], format: uuid }
        reversedBy:
          type: [string, "null"]
          format: uuid
          description: "Calculado: id del comprobante que lo reversa, si existe (no se guarda en el original)."
        totalDebit: { $ref: "#/components/schemas/Money" }
        totalCredit: { $ref: "#/components/schemas/Money" }
        postedAt: { type: string, format: date-time }
        postedBy: { type: string, format: uuid }
    JournalEntry:
      allOf:
        - $ref: "#/components/schemas/JournalEntrySummary"
        - type: object
          required: [lines]
          properties:
            reversalReason: { type: [string, "null"] }
            lines:
              type: array
              items: { $ref: "#/components/schemas/JournalLine" }
    SaveJournalDraftRequest:
      type: object
      required: [voucherType, lines]
      additionalProperties: false
      properties:
        voucherType: { type: string, pattern: '^[A-Z]{1,5}$' }
        accountingDate: { type: string, format: date }
        description: { type: string, maxLength: 500 }
        lines:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/JournalLineInput" }
        version:
          type: integer
          description: Requerido al reemplazar (bloqueo optimista).
    JournalDraft:
      type: object
      required: [id, voucherType, lines, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        voucherType: { type: string }
        accountingDate: { type: [string, "null"], format: date }
        description: { type: [string, "null"] }
        lines:
          type: array
          items: { $ref: "#/components/schemas/JournalLineInput" }
        version: { type: integer }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    JournalBookRow:
      type: object
      required: [entryId, accountingDate, voucherType, number, lineNo, accountCode, debit, credit]
      properties:
        entryId: { type: string, format: uuid }
        accountingDate: { type: string, format: date }
        voucherType: { type: string }
        number: { type: integer }
        lineNo: { type: integer }
        accountCode: { type: string }
        accountName: { type: string }
        partyId: { type: [string, "null"], format: uuid }
        debit: { $ref: "#/components/schemas/Money" }
        credit: { $ref: "#/components/schemas/Money" }
        description: { type: [string, "null"] }
    GeneralLedger:
      type: object
      required: [accountCode, from, to, openingBalance, movements, closingBalance]
      properties:
        accountCode: { type: string }
        accountName: { type: string }
        nature: { type: string, enum: [DEBIT, CREDIT] }
        from: { type: string, format: date }
        to: { type: string, format: date }
        openingBalance: { $ref: "#/components/schemas/SignedMoney" }
        closingBalance: { $ref: "#/components/schemas/SignedMoney" }
        movements:
          type: array
          items:
            type: object
            required: [entryId, accountingDate, voucherType, number, debit, credit, runningBalance]
            properties:
              entryId: { type: string, format: uuid }
              accountingDate: { type: string, format: date }
              voucherType: { type: string }
              number: { type: integer }
              debit: { $ref: "#/components/schemas/Money" }
              credit: { $ref: "#/components/schemas/Money" }
              runningBalance: { $ref: "#/components/schemas/SignedMoney" }
              description: { type: [string, "null"] }
        page:
          type: object
          properties:
            nextCursor: { type: [string, "null"] }
            hasMore: { type: boolean }
      description: Los saldos con signo se expresan en la naturaleza de la cuenta (positivo = saldo normal).
    TrialBalanceRow:
      type: object
      required: [accountCode, openingDebit, openingCredit, movementDebit, movementCredit, closingDebit, closingCredit, contraNature]
      properties:
        accountCode: { type: string }
        accountName: { type: string }
        nature: { type: string, enum: [DEBIT, CREDIT] }
        openingDebit: { $ref: "#/components/schemas/Money" }
        openingCredit: { $ref: "#/components/schemas/Money" }
        movementDebit: { $ref: "#/components/schemas/Money" }
        movementCredit: { $ref: "#/components/schemas/Money" }
        closingDebit: { $ref: "#/components/schemas/Money" }
        closingCredit: { $ref: "#/components/schemas/Money" }
        contraNature:
          type: boolean
          description: El saldo final tiene el lado contrario a la naturaleza de la cuenta (alerta, no se oculta).
    TrialBalance:
      type: object
      required: [from, to, rows, totals, balanced]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        level: { type: [integer, "null"] }
        rows:
          type: array
          items: { $ref: "#/components/schemas/TrialBalanceRow" }
        totals:
          type: object
          required: [openingDebit, openingCredit, movementDebit, movementCredit, closingDebit, closingCredit]
          properties:
            openingDebit: { $ref: "#/components/schemas/Money" }
            openingCredit: { $ref: "#/components/schemas/Money" }
            movementDebit: { $ref: "#/components/schemas/Money" }
            movementCredit: { $ref: "#/components/schemas/Money" }
            closingDebit: { $ref: "#/components/schemas/Money" }
            closingCredit: { $ref: "#/components/schemas/Money" }
        balanced:
          type: boolean
          description: Totales de débito y de crédito del saldo final coinciden.
